name: Suggest a paper
description: Suggest a paper on multimodal reward models or judges for the list.
title: "[Paper] "
labels: ["paper suggestion"]
body:
  - type: input
    id: paper-title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: arXiv, DOI, or venue page.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Where does it fit?
      options:
        - Signal construction
        - Supervision
        - Granularity
        - Deployment roles
        - Understanding tasks
        - Generation tasks
        - Transfer and unified rewards
        - Benchmarks and evaluation
        - Failure diagnosis
        - Related surveys
        - Not sure
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: What does it add?
      description: One or two sentences, for example the reward it proposes or the failure it measures.
