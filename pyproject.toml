[project]
name = "awesome-multimodal-reward"
version = "0.1.0"
description = "Paper list and explorer for a survey of multimodal reward models and judges"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
]

[dependency-groups]
import = [
    "pylatexenc>=2.10",
    "fastembed>=0.7.0",
    "numpy>=2.0",
]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false
